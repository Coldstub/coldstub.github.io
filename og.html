<!doctype html>
<html><head><meta charset="utf-8">

<style>
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("fonts/ibm-plex-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans JP"; font-weight: 400; src: url("fonts/ibm-plex-sans-jp-400-kana.woff2") format("woff2"); unicode-range: U+3064, U+306E, U+3075, U+3086, U+308A; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d1511; }
  body { position: relative; color: #c5d5cb; font: 34px/1.6 "IBM Plex Mono", "JetBrains Mono", Consolas, monospace; }
  :lang(ja) { font-family: "IBM Plex Sans JP", "Sarasa Mono J", "Maple Mono", "MS Gothic", "IBM Plex Mono", monospace; }
  .art {
    position: absolute; right: -40px; bottom: 56px; width: 400px; height: 400px;
    background: url("art.webp") center / cover no-repeat;
    filter: brightness(0.85); mix-blend-mode: lighten; opacity: 0.5;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 40%), linear-gradient(to top, transparent, #000 25%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 40%), linear-gradient(to top, transparent, #000 25%);
    mask-composite: intersect;
  }
  .t { position: absolute; left: 96px; top: 96px; }
  .t p { margin: 0; }
  .ps { color: #42f58d; text-shadow: 0 0 0.5em rgb(66 245 141 / 0.3); }
  .path, .m { color: #829c8c; text-shadow: none; }
  .cmd { color: #e0ebe4; }
  .name { font-size: 50px; line-height: 1.4; margin: 8px 0 0 !important; color: #e0ebe4; }
  .l { color: #7fe8d4; }
  .cur { display: inline-block; width: 0.6em; height: 1.1em; background: #1eff5a; vertical-align: text-bottom; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 96px; border-top: 1px solid #263c30; color: #829c8c; font-size: 24px; }
  .bar .mode { color: #1eff5a; }
</style></head>
